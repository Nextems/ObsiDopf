[package]
name = "ocr-worker"
version = "0.1.0"
edition = "2021"
[dependencies]
oar-ocr = { version = "0.9", features = ["auto-download"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.dev.package."*"]
opt-level = 3
